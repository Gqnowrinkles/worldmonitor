name: Stacked Merge Guard

# Required pre-merge safety gate. It protects stacked PR bases and also executes
# the root Docker builder on PR heads so the same build-order failures Coolify
# would hit are discovered before merge rather than after main changes.
#
# Pushes to main keep the lightweight structural/stacked checks only; the full
# builder already ran on the PR head and need not be repeated in this workflow.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: stacked-merge-guard-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  stacked-merge-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Guard Docker handler build structure
        run: node --test tests/build-handlers-syntax.test.mjs

      - name: Root Docker builder completes
        if: github.event_name == 'pull_request'
        run: docker build --target builder -f Dockerfile .

      - name: Guard stacked PR base
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-stacked-merge.mjs --mode pre-merge
